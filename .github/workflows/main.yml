name: Build Android App (.AAB and .APK)

on:
push:
branches: [ main, master ]
workflow_dispatch:

permissions:
contents: write

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout Repository
uses: actions/checkout@v4
with:
fetch-depth: 0

  - name: Setup Java JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: 'zulu'
      java-version: '17'

  - name: Setup Node.js 20
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK Platforms
    run: |
      echo "y" | sdkmanager "platforms;android-36" "build-tools;36.0.0"

  - name: Install Dependencies & Setup Capacitor
    run: |
      npm init -y
      npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-community/admob@6
      echo '{"appId":"com.synthlabs.synthbudget","appName":"SynthBudget","webDir":"www"}' > capacitor.config.json
      npx cap add android

  - name: Generate SynthBudget Adaptive App Icon
    run: |
      sudo apt-get update && sudo apt-get install -y imagemagick librsvg2-bin
      node -e '
      const fs = require("fs");
      const svg = `<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0B0F17" />
            <stop offset="100%" stop-color="#151C28" />
          </linearGradient>
          <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6366F1" />
            <stop offset="50%" stop-color="#06B6D4" />
            <stop offset="100%" stop-color="#10B981" />
          </linearGradient>
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="12" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>
        <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
        <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="#232D3F" stroke-width="8" />
        <path d="M256 90 L390 160 L390 320 L256 420 L122 320 L122 160 Z" fill="none" stroke="url(#neonGrad)" stroke-width="24" stroke-linejoin="round" filter="url(#glow)"/>
        <path d="M200 200 C200 170 230 160 256 160 C290 160 312 180 312 210 C312 240 280 250 256 260 C220 272 200 290 200 320 C200 350 225 365 256 365 C295 365 316 340 316 320" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"/>
        <circle cx="256" cy="260" r="14" fill="#06B6D4"/>
      </svg>`;
      fs.writeFileSync("app_icon.svg", svg);
      '

      rsvg-convert -w 512 -h 512 app_icon.svg -o icon_512.png
      
      convert icon_512.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
      convert icon_512.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
      convert icon_512.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
      convert icon_512.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
      convert icon_512.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
      cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
      cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
      cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
      cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      convert icon_512.png -resize 108x108 android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
      convert icon_512.png -resize 162x162 android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
      convert icon_512.png -resize 216x216 android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
      convert icon_512.png -resize 324x324 android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
      convert icon_512.png -resize 432x432 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png

  - name: Configure Target SDK 36, Version 10006 & AdMob
    run: |
      # Bump Version Code to 10006 and Version Name to 1.1.0
      sed -i 's/versionCode 10005/versionCode 10006/g' android/app/build.gradle
      sed -i 's/versionCode 10004/versionCode 10006/g' android/app/build.gradle
      sed -i 's/versionCode 10003/versionCode 10006/g' android/app/build.gradle
      sed -i 's/versionCode 10002/versionCode 10006/g' android/app/build.gradle
      sed -i 's/versionCode 10001/versionCode 10006/g' android/app/build.gradle
      sed -i 's/versionCode 1/versionCode 10006/g' android/app/build.gradle
      sed -i 's/versionName "1.0"/versionName "1.1.0"/g' android/app/build.gradle
      
      # Directly write SDK numbers to avoid rootProject null errors
      sed -i 's/compileSdkVersion rootProject.ext.compileSdkVersion/compileSdkVersion 36/g' android/app/build.gradle
      sed -i 's/targetSdkVersion rootProject.ext.targetSdkVersion/targetSdkVersion 36/g' android/app/build.gradle
      sed -i 's/minSdkVersion rootProject.ext.minSdkVersion/minSdkVersion 22/g' android/app/build.gradle
      
      # Fallback sed patterns just in case
      sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 36/g' android/app/build.gradle
      sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/g' android/app/build.gradle
      
      # Inject AdMob App ID
      sed -i '/<\/application>/i <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-1977225319753961~6485522419"/>' android/app/src/main/AndroidManifest.xml
      
      npx cap sync android

  - name: Build Android Bundle & APK
    run: |
      cd android
      chmod +x gradlew
      ./gradlew bundleRelease assembleDebug --no-daemon

  - name: Sign App Bundle with Permanent Keystore
    run: |
      if [ ! -f release.jks ]; then
        echo "Generating permanent release.jks keystore..."
        keytool -genkeypair -v -keystore release.jks -alias synthkey -keyalg RSA -keysize 2048 -validity 10000 -storepass synthbudget123 -keypass synthbudget123 -dname "CN=SynthBudget, OU=Production, O=SynthLabs, C=IN"
        
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add release.jks
        git commit -m "Add permanent release keystore [skip ci]" || true
        git push origin HEAD:${{ github.ref_name }} || true
      else
        echo "Using existing permanent release.jks from repository."
      fi

      jarsigner -keystore release.jks -storepass synthbudget123 -keypass synthbudget123 android/app/build/outputs/bundle/release/app-release.aab synthkey
      keytool -export -rfc -keystore release.jks -alias synthkey -file upload_certificate.pem -storepass synthbudget123

  - name: Upload Signed .AAB
    uses: actions/upload-artifact@v4
    with:
      name: SynthBudget-Signed-AAB
      path: android/app/build/outputs/bundle/release/*.aab

  - name: Upload PEM Certificate (For Play Console Upload Key Reset)
    uses: actions/upload-artifact@v4
    with:
      name: Google-Play-PEM-Certificate
      path: upload_certificate.pem

  - name: Upload .APK
    uses: actions/upload-artifact@v4
    with:
      name: SynthBudget-Test-APK
      path: android/app/build/outputs/apk/debug/*.apk
