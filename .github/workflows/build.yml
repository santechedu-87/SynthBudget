name: Build Android App (.AAB and .APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor & Sync
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          echo '{"appId":"com.synthlabs.synthbudget","appName":"SynthBudget","webDir":"www"}' > capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Update Version Code
        run: |
          sed -i 's/versionCode 1/versionCode 10001/g' android/app/build.gradle

      - name: Build Android Bundle & APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleDebug --no-daemon

      - name: Sign App Bundle & Export Certificate
        run: |
          keytool -genkeypair -v -keystore release.jks -alias releaseKey -keyalg RSA -keysize 2048 -validity 10000 -storepass synthbudget123 -keypass synthbudget123 -dname "CN=SynthBudget, OU=Mobile, O=SynthLabs, C=IN" -startdate "2026/01/01 00:00:00"
          jarsigner -keystore release.jks -storepass synthbudget123 -keypass synthbudget123 android/app/build/outputs/bundle/release/app-release.aab releaseKey
          keytool -export -rfc -keystore release.jks -alias releaseKey -file upload_certificate.pem -storepass synthbudget123

      - name: Upload Signed .AAB
        uses: actions/upload-artifact@v4
        with:
          name: SynthBudget-Signed-AAB
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload PEM Certificate (For Play Console Reset)
        uses: actions/upload-artifact@v4
        with:
          name: Google-Play-PEM-Certificate
          path: upload_certificate.pem

      - name: Upload .APK (For Phone Testing)
        uses: actions/upload-artifact@v4
        with:
          name: SynthBudget-Test-APK
          path: android/app/build/outputs/apk/debug/*.apk
