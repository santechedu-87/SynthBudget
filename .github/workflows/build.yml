name: Build Android App (.AAB and .APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Web Assets & Capacitor Config
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.synthlabs.synthbudget",
            "appName": "SynthBudget",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Update Version Code
        run: |
          if [ -f android/app/build.gradle ]; then
            sed -i 's/versionCode 1/versionCode 10001/g' android/app/build.gradle
          fi

      - name: Build Android Bundle & APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload .AAB (For Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: SynthBudget-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload .APK (For Phone Testing)
        uses: actions/upload-artifact@v4
        with:
          name: SynthBudget-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
