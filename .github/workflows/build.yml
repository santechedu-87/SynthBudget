name: Build Android App (.AAB and .APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor & Generate Project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init SynthBudget com.synthlabs.synthbudget --web-dir www
          npx cap add android
          npx cap sync android

      - name: Update Version Code
        run: |
          if [ -f android/app/build.gradle ]; then
            sed -i 's/versionCode 1/versionCode 10001/g' android/app/build.gradle
          fi

      - name: Build Android AAB and APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleDebug assembleDebug --no-daemon

      - name: Upload .AAB (For Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: SynthBudget-Release-AAB
          path: android/app/build/outputs/bundle/debug/*.aab

      - name: Upload .APK (For Phone Testing)
        uses: actions/upload-artifact@v4
        with:
          name: SynthBudget-Release-APK
          path: android/app/build/outputs/apk/debug/*.apk
