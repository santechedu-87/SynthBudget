name: Build Android App (.AAB and .APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Capacitor & Configure
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init SynthBudget com.synthlabs.synthbudget --web-dir www
          npx cap add android
          npx cap sync

      - name: Update Version Code
        run: |
          if [ -f android/app/build.gradle ]; then
            sed -i 's/versionCode 1/versionCode 10001/g' android/app/build.gradle
          fi

      - name: Build Android Bundle & APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --stacktrace

      - name: Upload .AAB (For Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: SynthBudget-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload .APK (For Phone Testing)
        uses: actions/upload-artifact@v4
        with:
          name: SynthBudget-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
