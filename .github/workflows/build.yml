name: Build Android App (.AAB and .APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies & Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init SynthBudget com.synthlabs.synthbudget --web-dir www
          npx cap add android
          npx cap sync

      - name: Update Version Code in Gradle
        run: |
          sed -i 's/versionCode 1/versionCode 10001/g' android/app/build.gradle

      - name: Build Unsigned AAB & APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease

      - name: Upload .AAB Bundle (For Google Play)
        uses: actions/upload-artifact@v3
        with:
          name: SynthBudget-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload .APK File (For Phone Testing)
        uses: actions/upload-artifact@v3
        with:
          name: SynthBudget-Release-APK
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

